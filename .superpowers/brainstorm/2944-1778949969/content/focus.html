<h2>NextDo 有哪些让你觉得「卡住了」的地方？</h2>
<p class="subtitle">我们先定位痛点，再想方案。选一个你最想先解决的：</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="entry" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>录入效率低</h3>
      <p>创建任务太慢，要填的字段太多。想快速捕捉想法但流程太重</p>
    </div>
  </div>
  <div class="option" data-choice="organize" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>组织混乱</h3>
      <p>任务多了之后找不到、理不清。项目/标签/象限不够用或不好用</p>
    </div>
  </div>
  <div class="option" data-choice="review" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>回顾困难</h3>
      <p>看不到全局进度。不知道时间花在哪了。想复盘但数据散落各处</p>
    </div>
  </div>
  <div class="option" data-choice="motivate" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>缺乏动力</h3>
      <p>任务越堆越多，打开应用有压力。缺乏正向反馈，容易摆烂</p>
    </div>
  </div>
  <div class="option" data-choice="workflow" onclick="toggleSelect(this)">
    <div class="letter">E</div>
    <div class="content">
      <h3>工作流断裂</h3>
      <p>四个视图（矩阵/日历/日/列表）之间切换不流畅。想做的事跨越多个视图但操作不连贯</p>
    </div>
  </div>
  <div class="option" data-choice="other" onclick="toggleSelect(this)">
    <div class="letter">F</div>
    <div class="content">
      <h3>其他</h3>
      <p>以上都不是。我有具体的痛点想在终端里描述</p>
    </div>
  </div>
</div>
